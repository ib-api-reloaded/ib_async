name: ib_async

on: [push, pull_request]

# Protobuf bindings under ib_async/_pb/ are gitignored — generated
# at build/dev/CI time. The version + SHA256 of IBKR's TWS API
# archive are pinned in pyproject.toml [tool.ib_async.twsapi].
# scripts/generate_protos.py fetches that exact archive (cached
# under ~/.cache/ib_async/twsapi-{version}/), SHA-verifies, extracts
# the protos + the parity audit's reference client_utils.py, and
# runs protoc. The same script powers local dev, CI, and the
# release pipeline so all three operate on identical bytes.

jobs:
  build-poetry:
    name: poetry (${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14", "pypy3.11"]

    steps:
      - uses: actions/checkout@v6

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install Poetry toolchain
        run: |
          pip install pip poetry setuptools wheel -U

      - name: Install dependencies with Poetry
        run: |
          poetry install --with=dev

      - name: Read TWS API version pin
        id: twsapi
        shell: bash
        # Single source of truth: pyproject.toml [tool.ib_async.twsapi].
        # Cache key derives from the pinned version so a bump
        # automatically invalidates the cache without manual steps.
        run: |
          v=$(python -c 'import tomllib; print(tomllib.load(open("pyproject.toml","rb"))["tool"]["ib_async"]["twsapi"]["version"])')
          echo "version=$v" >> "$GITHUB_OUTPUT"

      - name: Cache TWS API archive
        uses: actions/cache@v4
        with:
          path: ~/.cache/ib_async/twsapi-${{ steps.twsapi.outputs.version }}
          key: twsapi-${{ steps.twsapi.outputs.version }}

      - name: Generate protobuf bindings
        run: |
          poetry run python scripts/generate_protos.py

      - name: MyPy static code analysis
        if: ${{ !startsWith(matrix.python-version, 'pypy') }}
        run: |
          poetry run mypy --pretty ib_async

      - name: Ruff check
        run: |
          poetry run ruff check

      - name: Run owned test suite
        run: |
          poetry run pytest -q

  build-uv:
    name: uv (${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14", "pypy3.11"]

    steps:
      - uses: actions/checkout@v6

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install uv toolchain
        run: |
          pip install pip uv setuptools wheel -U

      - name: Install dependencies with uv
        run: |
          uv sync --group dev

      - name: Read TWS API version pin
        id: twsapi
        shell: bash
        run: |
          v=$(python -c 'import tomllib; print(tomllib.load(open("pyproject.toml","rb"))["tool"]["ib_async"]["twsapi"]["version"])')
          echo "version=$v" >> "$GITHUB_OUTPUT"

      - name: Cache TWS API archive
        uses: actions/cache@v4
        with:
          path: ~/.cache/ib_async/twsapi-${{ steps.twsapi.outputs.version }}
          key: twsapi-${{ steps.twsapi.outputs.version }}

      - name: Generate protobuf bindings
        run: |
          uv run python scripts/generate_protos.py

      - name: MyPy static code analysis
        if: ${{ !startsWith(matrix.python-version, 'pypy') }}
        run: |
          uv run mypy --pretty ib_async

      - name: Ruff check
        run: |
          uv run ruff check

      - name: Run owned test suite
        run: |
          uv run pytest -q

  # Catches the "google module not found" class of release-engineering
  # regression: build the wheel, install it into a clean venv, import
  # the package. If ``_pb/`` is missing from the wheel manifest (or
  # any runtime dependency is missing from the metadata), this fails
  # before users do — not after the first ``pip install ib_async``.
  wheel-smoke:
    name: wheel smoke test (${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.13"]

    steps:
      - uses: actions/checkout@v6

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install uv toolchain
        run: |
          pip install pip uv setuptools wheel -U

      - name: Read TWS API version pin
        id: twsapi
        shell: bash
        run: |
          v=$(python -c 'import tomllib; print(tomllib.load(open("pyproject.toml","rb"))["tool"]["ib_async"]["twsapi"]["version"])')
          echo "version=$v" >> "$GITHUB_OUTPUT"

      - name: Cache TWS API archive
        uses: actions/cache@v4
        with:
          path: ~/.cache/ib_async/twsapi-${{ steps.twsapi.outputs.version }}
          key: twsapi-${{ steps.twsapi.outputs.version }}

      - name: Build wheel + sdist with bundled protos
        run: |
          uv sync --group dev
          make build

      - name: Clean-venv install + import smoke test
        run: |
          python -m venv /tmp/smoke-venv
          /tmp/smoke-venv/bin/pip install --upgrade pip
          /tmp/smoke-venv/bin/pip install dist/*.whl
          /tmp/smoke-venv/bin/python -c "import ib_async; ib_async.IB(); print('smoke ok')"
