# Adapted from https://tomasfarias.dev/articles/sphinx-docs-with-poetry-and-github-pages/
# (the original used Poetry; this project is uv/PEP 621 only.)
name: docs
on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build-docs:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: 3.12

      - name: Install uv toolchain
        uses: astral-sh/setup-uv@v10.3.2

      - name: Install dependencies
        run: |
          uv sync --frozen --group docs

      # The API pages import ib_async, which needs the generated bindings.
      - name: Generate protobuf bindings
        run: make protos
        env:
          UV_FROZEN: "1"

      - name: Build documentation
        run: |
          mkdir html
          touch html/.nojekyll
          uv run --frozen sphinx-build -b html docs html

      - name: Upload documentation artifact
        if: ${{ github.event_name == 'push' }}
        uses: actions/upload-pages-artifact@v5
        with:
          path: html

      - name: Deploy documentation
        if: ${{ github.event_name == 'push' }}
        uses: actions/deploy-pages@v5
