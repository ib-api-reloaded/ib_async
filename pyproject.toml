[project]
name = "ib_async"
version = "2.1.0"
description = "Python sync/async framework for Interactive Brokers API"
readme = "README.md"
license = "BSD-2-Clause"
license-files = ["LICENSE"]
requires-python = ">=3.11"
authors = [{ name = "Ewald de Wit" }]
maintainers = [{ name = "Matt Stancliff", email = "matt@matt.sh" }]
keywords = ["ibapi", "tws", "asyncio", "jupyter", "interactive", "brokers", "async", "ib_async", "ib_insync"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Topic :: Office/Business :: Financial :: Investment",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3 :: Only",
]
dependencies = [
    "aeventkit>=2.1.0,<3.0.0",
    "nest_asyncio",
    "tzdata>=2025.2,<2026.0",
]

[project.urls]
Repository = "https://github.com/ib-api-reloaded/ib_async"
"Bug Tracker" = "https://github.com/ib-api-reloaded/ib_async/issues"

[dependency-groups]
dev = [
    "mypy>=1.11.0",
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pandas>=2.2.1,<3.0.0",
    "ruff>=0.11.13,<0.12.0",
]
docs = [
    "sphinx-autodoc-typehints>=2.0.0,<3.0.0",
    "sphinx-rtd-theme>=2.0.0,<3.0.0",
    "myst-parser>=2.0.0,<3.0.0",
]

[tool.poetry]
include = ["ib_async/py.typed"]

[tool.poetry.dependencies]
python = ">=3.11"
aeventkit = "^2.1.0"
# aeventkit = { path = "../eventkit", develop = true }
nest_asyncio = "*"
tzdata = "^2025.2"

[tool.poetry.group.dev]
optional = true

[tool.poetry.group.dev.dependencies]
mypy = ">=1.11.0"
pytest = ">=8.0"
pytest-asyncio = ">=0.23"
pandas = "^2.2.1"
ruff = "^0.11.13"


[tool.poetry.group.docs]
optional = true

[tool.poetry.group.docs.dependencies]
sphinx-autodoc-typehints = "^2.0.0"
sphinx-rtd-theme = "^2.0.0"
myst-parser = "^2.0.0"


[tool.mypy]
ignore_missing_imports = true
check_untyped_defs = true


[tool.pytest.ini_options]
asyncio_mode="auto"


[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.ruff]
target-version = "py311"
exclude = [
  "notebooks/",
  "upstream_api_architecture/",
  "examples/",
]

[tool.ruff.lint]
extend-select = [
  # convert legacy python syntax to modern syntax
  "UP",
  # isort imports
  "I",
]
ignore = ["E402"] # Ignore Module level import not at top of file
