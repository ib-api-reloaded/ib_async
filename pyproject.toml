[tool.poetry]
name = "ib_async"
version = "2.0.1"
description = "Python sync/async framework for Interactive Brokers API"
authors = ["Ewald de Wit"]
maintainers = ["Matt Stancliff <matt@matt.sh>"]
license = "BSD"
readme = "README.md"
repository = "https://github.com/ib-api-reloaded/ib_async"
packages = [{ include = "ib_async" }]
include = ["ib_async/py.typed"]
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Intended Audience :: Developers",
  "Topic :: Office/Business :: Financial :: Investment",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3 :: Only",
]
keywords = [
  "ibapi",
  "tws",
  "asyncio",
  "jupyter",
  "interactive",
  "brokers",
  "async",
  "ib_async",
  "ib_insync",
]

[tool.poetry.dependencies]
python = ">=3.10"
aeventkit = "^2.1.0"
# aeventkit = { path = "../eventkit", develop = true }
nest_asyncio = "*"
protobuf = "*"
tzdata = "^2025.2"

[tool.poetry.urls]
"Bug Tracker" = "https://github.com/ib-api-reloaded/ib_async/issues"


[tool.poetry.group.dev]
optional = true

[tool.poetry.group.dev.dependencies]
mypy = ">=1.11.0"
pytest = ">=8.0"
pytest-asyncio = ">=0.23"
pandas = "^2.2.1"
ruff = "^0.11.13"
grpcio-tools = "^1.75.1"
pytest-timeout = "*"
pytest-cov = "^6.2.1"
pre-commit = "^3.5.0"

[tool.poetry.group.docs]
optional = true

[tool.poetry.group.docs.dependencies]
sphinx-autodoc-typehints = "^2.0.0"
sphinx-rtd-theme = "^2.0.0"
myst-parser = "^2.0.0"


[tool.mypy]
ignore_missing_imports = true
check_untyped_defs = true
exclude = ["^ib_async/protobuf/"]
follow_imports = "silent"


[tool.pytest.ini_options]
testpaths = ["tests"]
log_cli = true
log_date_format = "%Y-%m-%S %H:%M:%S"
minversion = "6.0"
filterwarnings = "ignore"
asyncio_mode = "strict"
asyncio_default_fixture_loop_scope = "function"
asyncio_default_test_loop_scope = "function"
timeout = 10

[tool.ruff]
line-length = 88
fix = true
exclude = ["ib_async/protobuf/*", "examples/", "notebooks/"]

[tool.ruff.lint]
extend-select = [
  # convert legacy python syntax to modern syntax
  "UP",
  # isort imports
  "I",
  "F",
  "E",
]
ignore = [
  "E402", # Ignore Module level import not at top of file
  "E501", # Ingnore long lines, specially in comments and docstrings
]

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
