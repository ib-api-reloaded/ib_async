[project]
name = "ib_async"
version = "3.0.0"
description = "Python sync/async framework for Interactive Brokers API"
readme = "README.md"
license = "BSD-2-Clause"
license-files = ["LICENSE"]
requires-python = ">=3.11"
authors = [{ name = "Ewald de Wit" }]
maintainers = [{ name = "Matt Stancliff", email = "matt@matt.sh" }]
keywords = ["ibapi", "tws", "asyncio", "jupyter", "interactive", "brokers", "async", "ib_async", "ib_insync"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Topic :: Office/Business :: Financial :: Investment",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3 :: Only",
]
dependencies = [
    "aeventkit>=2.1.0,<3.0.0",
    "nest_asyncio",
    "protobuf>=5.0.0,<7.0.0",
    "tzdata>=2025.2"
]

[project.urls]
Repository = "https://github.com/ib-api-reloaded/ib_async"
"Bug Tracker" = "https://github.com/ib-api-reloaded/ib_async/issues"

[dependency-groups]
dev = [
    "mypy>=1.11.0",
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-xdist>=3.6,<4.0",
    "pytest-timeout>=2.3.1,<3.0.0",
    "pandas>=2.2.1,<3.0.0; implementation_name != 'pypy'",
    "ruff>=0.17.0,<0.18.0",
]
# Generating the protobuf bindings (`make protos`, release builds) only;
# kept out of `dev` so test environments never install or build grpcio.
protos = [
    "grpcio-tools>=1.60.0",
]
docs = [
    # Python 3.12+ gets the newest releases. On 3.11 the newest
    # sphinx-autodoc-typehints that installs targets Sphinx 8, so Sphinx
    # stays on 8 there (Sphinx 9 deprecates the API that release uses).
    "sphinx>=9.1.0,<10.0.0; python_version >= '3.12'",
    "sphinx>=8.1.0,<9.0.0; python_version < '3.12'",
    "sphinx-autodoc-typehints>=3.0.0,<4.0.0",
    "sphinx-rtd-theme>=3.0.0,<4.0.0",
    "myst-parser>=4.0.0,<6.0.0",
]

[tool.ib_async.twsapi]
# Single source of truth for the IBKR TWS API version this build is
# wired against. Consumed by ``scripts/generate_protos.py``,
# ``scripts/release.py``, ``scripts/audit_proto_parity.py``, and CI
# — they all read these constants so the proto bindings and the
# parity audit's reference ``client_utils.py`` stay version-locked.
#
# To bump: ``make twsapi-bump V=<version>`` fetches and checks the
# archive, then rewrites the two keys below; follow with ``make
# protos`` + tests + audit. ``make twsapi-status`` lists the versions
# IBKR still serves. The IBKR URL convention drops the first dot of
# ``API_Version``, so 10.51.01 → 1051.01.
version = "1051.01"
archive_sha256 = "50a459ed09f0030df25125a177e57b69bdf576ec3a89fcb1f81fdff95bbf6316"

[tool.mypy]
ignore_missing_imports = true
check_untyped_defs = true


[tool.pytest.ini_options]
asyncio_mode = "auto"
# ``live`` tests require a running TWS / IB Gateway on
# 127.0.0.1:7497. They are dangerous (real orders) and useless (no
# server) by default, so the default ``addopts`` deselects them.
# Opt in with ``pytest -m live`` or ``pytest -m 'live or not live'``
# to include them.
addopts = "-m 'not live'"
markers = [
    "live: requires a running TWS / IB Gateway on 127.0.0.1:7497 (deselected by default)",
]


[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

# ``ib_async/_pb/`` holds protobuf bindings generated from IBKR's
# upstream ``.proto`` schemas by ``scripts/generate_protos.py``. The
# directory is gitignored — generated artifacts never enter version
# control — so the Makefile / release workflow regenerates them
# locally before invoking ``uv build``.
#
# Hatchling honours VCS ignore files when selecting distribution
# contents, so a plain ``include`` could never see ``_pb``.
# ``artifacts`` is precisely the escape hatch for generated files:
# the globs below re-admit whatever ``_pb`` files exist on disk into
# both the sdist and the wheel, and a checkout *without* generated
# bindings still builds — the globs simply match nothing. End users
# of ``pip install ib_async`` therefore get the bindings without
# needing ``protoc`` or ``grpcio-tools``.
#
# ``artifacts`` sits on ``[tool.hatch.build]`` (not on a single
# target) so it applies to the sdist and the wheel alike, which is
# what the old poetry ``format = ["sdist", "wheel"]`` entries meant.
# It matters because ``uv build`` builds the wheel *from* the sdist:
# if the sdist dropped ``_pb``, the wheel would lose it too.
[tool.hatch.build]
artifacts = [
    "ib_async/_pb/**/*.py",
    "ib_async/_pb/**/*.pyi",
    "ib_async/_pb/py.typed",
]

# Poetry's masonry backend auto-selected the package matching the
# project name. Name it explicitly so wheel contents never depend on
# backend auto-discovery.
[tool.hatch.build.targets.wheel]
packages = ["ib_async"]

# Poetry's sdist carried the package plus the project metadata files;
# tests, docs, notebooks and examples were never shipped. Hatchling
# otherwise defaults to "everything not VCS-ignored", so state the
# sdist contents explicitly to keep the published archive identical
# in scope to what poetry-core produced.
[tool.hatch.build.targets.sdist]
include = ["/ib_async", "/README.md", "/LICENSE", "/pyproject.toml"]

[tool.ruff]
target-version = "py311"
exclude = [
  "notebooks/",
  "upstream_api_architecture/",
  "examples/",
  # Generated protobuf bindings live under ib_async/_pb/ (gitignored,
  # produced by scripts/generate_protos.py). They aren't subject to
  # our lint or format rules.
  "ib_async/_pb/",
]

[tool.ruff.lint]
# Listed explicitly so a ruff upgrade never changes what is checked.
select = [
  # pycodestyle errors and pyflakes (ruff's long-standing defaults)
  "E4",
  "E7",
  "E9",
  "F",
  # convert legacy python syntax to modern syntax
  "UP",
  # isort imports
  "I",
  # simplifications
  "SIM",
  # pathlib over os.path / open()
  "PTH",
  # modern idioms (refurb)
  "FURB",
  # specific ignore / type-ignore codes
  "PGH",
  # imports at module level only; a deliberate lazy import (an optional
  # dependency) carries `noqa: PLC0415` with its reason
  "PLC0415",
  # no mutable or call-built argument defaults (shared across calls)
  "B006",
  "B008",
  # exceptions: chain re-raises, no blind catches or blind test asserts
  "B904",
  "BLE001",
  "B017",
  "TRY401",
  # zip() states whether unequal lengths are expected
  "B905",
  # equality, hashing and shared class state stay consistent
  "PLW1641",
  "RUF012",
  "PLR0124",
  # no blocking calls inside async functions
  "ASYNC210",
  "ASYNC220",
  "ASYNC221",
  "ASYNC222",
  "ASYNC230",
  "ASYNC251",
  # current idioms: comprehensions and literals, membership tests,
  # no redundant casts, placeholders or numeric unions
  "C4",
  "PIE790",
  "PIE807",
  "PIE810",
  "PLR0402",
  "PLR1714",
  "PLR5501",
  "PLR0133",
  "PYI041",
  "RUF021",
  "RUF046",
  "RUF059",
  # no exec(); no unused noqa comments
  "S102",
  "RUF100",
  # no assert for runtime checks in the library (python -O strips them)
  "S101",
]
per-file-ignores = { "tests/**" = ["S101"], "scripts/**" = ["S101"] }
ignore = [
  "E402", # Module level import not at top of file
  "SIM102", # collapsible-if: nested ifs often read clearer
  "SIM110", # reimplemented-builtin: explicit loops often read clearer
]
