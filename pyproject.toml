[project]
name = "ib_async"
version = "3.0.0"
description = "Python sync/async framework for Interactive Brokers API"
readme = "README.md"
license = "BSD-2-Clause"
license-files = ["LICENSE"]
requires-python = ">=3.11"
authors = [{ name = "Ewald de Wit" }]
maintainers = [{ name = "Matt Stancliff", email = "matt@matt.sh" }]
keywords = ["ibapi", "tws", "asyncio", "jupyter", "interactive", "brokers", "async", "ib_async", "ib_insync"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Topic :: Office/Business :: Financial :: Investment",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3 :: Only",
]
dependencies = [
    "aeventkit>=2.1.0,<3.0.0",
    "nest_asyncio",
    "protobuf>=5.0.0,<7.0.0",
    "tzdata>=2025.2"
]

[project.urls]
Repository = "https://github.com/ib-api-reloaded/ib_async"
"Bug Tracker" = "https://github.com/ib-api-reloaded/ib_async/issues"

[dependency-groups]
dev = [
    "grpcio-tools>=1.60.0",
    "mypy>=1.11.0",
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-xdist>=3.6,<4.0",
    "pandas>=2.2.1,<3.0.0; implementation_name != 'pypy'",
    "ruff>=0.11.13,<0.12.0",
]
docs = [
    "sphinx-autodoc-typehints>=2.0.0,<3.0.0",
    "sphinx-rtd-theme>=2.0.0,<3.0.0",
    "myst-parser>=2.0.0,<3.0.0",
]

[tool.ib_async.twsapi]
# Single source of truth for the IBKR TWS API version this build is
# wired against. Consumed by ``scripts/generate_protos.py``,
# ``scripts/release.py``, ``scripts/audit_proto_parity.py``, and CI
# — they all read these constants so the proto bindings and the
# parity audit's reference ``client_utils.py`` stay version-locked.
#
# To bump: edit ``version``, download the new archive, recompute
# SHA256, edit ``archive_sha256``, run ``make protos`` + tests +
# audit. The IBKR URL convention drops the first dot of
# ``API_Version``, so 10.46.01 → 1046.01.
version = "1046.01"
archive_sha256 = "d62d0bd602d9b0154f73246b1224467b6cff7062d34fe864510691b7677148c4"

[tool.poetry]
# ``ib_async/_pb/`` holds protobuf bindings generated from IBKR's
# upstream ``.proto`` schemas by ``scripts/generate_protos.py``. The
# directory is gitignored — generated artifacts never enter version
# control — so the Makefile / release workflow regenerates them
# locally before invoking ``uv build``. The glob below tells
# poetry-core to bundle whatever ``_pb/*`` files exist on disk into
# the sdist and wheel so end users of ``pip install ib_async`` get
# the bindings without needing ``protoc`` or ``grpcio-tools``.
include = [
    "ib_async/py.typed",
    { path = "ib_async/_pb/**/*.py", format = ["sdist", "wheel"] },
    { path = "ib_async/_pb/**/*.pyi", format = ["sdist", "wheel"] },
    { path = "ib_async/_pb/py.typed", format = ["sdist", "wheel"] },
]

[tool.mypy]
ignore_missing_imports = true
check_untyped_defs = true


[tool.pytest.ini_options]
asyncio_mode = "auto"
# ``live`` tests require a running TWS / IB Gateway on
# 127.0.0.1:7497. They are dangerous (real orders) and useless (no
# server) by default, so the default ``addopts`` deselects them.
# Opt in with ``pytest -m live`` or ``pytest -m 'live or not live'``
# to include them.
addopts = "-m 'not live'"
markers = [
    "live: requires a running TWS / IB Gateway on 127.0.0.1:7497 (deselected by default)",
]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.ruff]
target-version = "py311"
exclude = [
  "notebooks/",
  "upstream_api_architecture/",
  "examples/",
  # Generated protobuf bindings live under ib_async/_pb/ (gitignored,
  # produced by scripts/generate_protos.py). They aren't subject to
  # our lint or format rules.
  "ib_async/_pb/",
]

[tool.ruff.lint]
extend-select = [
  # convert legacy python syntax to modern syntax
  "UP",
  # isort imports
  "I",
]
ignore = ["E402"] # Ignore Module level import not at top of file
