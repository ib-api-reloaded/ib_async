[project]
name = "ib_async"
version = "3.0.0"
description = "Python sync/async framework for Interactive Brokers API"
readme = "README.md"
license = "BSD-2-Clause"
license-files = ["LICENSE"]
requires-python = ">=3.11"
authors = [{ name = "Ewald de Wit" }]
maintainers = [{ name = "Matt Stancliff", email = "matt@matt.sh" }]
keywords = ["ibapi", "tws", "asyncio", "jupyter", "interactive", "brokers", "async", "ib_async", "ib_insync"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Topic :: Office/Business :: Financial :: Investment",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
    "Programming Language :: Python :: 3 :: Only",
]
dependencies = [
    "aeventkit>=3.0.1,<4.0.0",
    "anest-asyncio>=2.0.0,<3.0.0",
    "protobuf>=7.36.2,<8.0.0",
    "typing-extensions>=4.16.0 ; python_full_version < '3.13'",
    "tzdata>=2025.2",
]

[project.optional-dependencies]
# util.df() and FlexReport.df() return polars DataFrames.
polars = ["polars>=2.0.0,<3.0.0"]

[project.urls]
Repository = "https://github.com/ib-api-reloaded/ib_async"
"Bug Tracker" = "https://github.com/ib-api-reloaded/ib_async/issues"

[dependency-groups]
# What the tests need, and nothing else: `make test` installs only this
# group, so the tests also run where the lint tools have no wheels (PyPy).
test = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-timeout>=2.3.1,<3.0.0",
    # polars has no PyPy wheels; the DataFrame tests skip there.
    "polars>=2.0.0,<3.0.0; implementation_name != 'pypy'",
    # Only the tests use numpy. They put numpy scalars in order fields.
    # numpy has no PyPy 3.12 wheel. The test skips when numpy is missing.
    "numpy>=2.0,<3.0; implementation_name != 'pypy'",
    # hypothesis 6.156 and later ship compiled wheels with no PyPy 3.12
    # build; 6.155.7 is the last version with a wheel for it.
    "hypothesis>=6.156,<7; implementation_name != 'pypy' or python_version != '3.12'",
    "hypothesis==6.155.7; implementation_name == 'pypy' and python_version == '3.12'",
    "pytest-xdist>=3.5,<4",
]
dev = [
    # mypy runs on CPython only (CI skips it on PyPy). mypy 2 needs
    # ast-serialize, which has no PyPy wheel.
    "mypy>=1.11.0; implementation_name != 'pypy'",
    "ruff>=0.17.0,<0.18.0",
    { include-group = "test" },
]
# Generating the protobuf bindings (`make protos`, release builds) only;
# kept out of `dev` so test environments never install or build grpcio.
protos = [
    "grpcio-tools>=1.84.0,<2.0.0",
]
docs = [
    # sphinx-autodoc-typehints 3.6.1 is the last release for Python 3.11
    # and the first for Sphinx 9. Python 3.12 and later get newer releases.
    "sphinx>=9.0.4,<10.0.0",
    "sphinx-autodoc-typehints>=3.6.1,<4.0.0",
    "sphinx-rtd-theme>=3.0.0,<4.0.0",
    "myst-parser>=4.0.0,<6.0.0",
    # so the API docs resolve util.df()'s return type
    "polars>=2.0.0,<3.0.0",
]
# Running and checking examples/ (`make examples-check`): marimo notebooks,
# DataFrames and plots.
examples = [
    "marimo>=0.25.1,<1.0.0",
    "polars>=2.0.0,<3.0.0",
    "matplotlib>=3.9.0,<4.0.0",
]

[tool.ib_async.twsapi]
# Single source of truth for the IBKR TWS API version this build is
# wired against. Consumed by ``scripts/generate_protos.py``,
# ``scripts/twsapi.py``, and CI — they all read these constants so
# the proto bindings stay version-locked.
#
# To bump: ``make twsapi-bump V=<version>`` fetches and checks the
# archive, then rewrites the two keys below; follow with ``make
# protos`` + tests. ``make twsapi-status`` lists the versions
# IBKR still serves. The IBKR URL convention drops the first dot of
# ``API_Version``, so 10.51.01 → 1051.01.
version = "1051.01"
archive_sha256 = "50a459ed09f0030df25125a177e57b69bdf576ec3a89fcb1f81fdff95bbf6316"

[tool.mypy]
ignore_missing_imports = true
check_untyped_defs = true


[tool.pytest.ini_options]
asyncio_mode = "auto"
# Each test runs on a loop of its own (tests/_loops.py); LOOP=shared with
# a make test target runs them all on one loop, as an application does.
asyncio_default_test_loop_scope = "function"
asyncio_default_fixture_loop_scope = "function"


[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

# ``ib_async/_pb/`` holds protobuf bindings generated from IBKR's
# upstream ``.proto`` schemas by ``scripts/generate_protos.py``. The
# directory is gitignored — generated artifacts never enter version
# control — so the Makefile / release workflow regenerates them
# locally before invoking ``uv build``.
#
# Hatchling honours VCS ignore files when selecting distribution
# contents, so a plain ``include`` could never see ``_pb``.
# ``artifacts`` is precisely the escape hatch for generated files:
# the globs below re-admit whatever ``_pb`` files exist on disk into
# both the sdist and the wheel, and a checkout *without* generated
# bindings still builds — the globs simply match nothing. End users
# of ``pip install ib_async`` therefore get the bindings without
# needing ``protoc`` or ``grpcio-tools``.
#
# ``artifacts`` sits on ``[tool.hatch.build]`` (not on a single
# target) so it applies to the sdist and the wheel alike, which is
# what the old poetry ``format = ["sdist", "wheel"]`` entries meant.
# It matters because ``uv build`` builds the wheel *from* the sdist:
# if the sdist dropped ``_pb``, the wheel would lose it too.
[tool.hatch.build]
artifacts = [
    "ib_async/_pb/**/*.py",
    "ib_async/_pb/**/*.pyi",
    "ib_async/_pb/py.typed",
]

# Poetry's masonry backend auto-selected the package matching the
# project name. Name it explicitly so wheel contents never depend on
# backend auto-discovery.
[tool.hatch.build.targets.wheel]
packages = ["ib_async"]

# Poetry's sdist carried the package plus the project metadata files;
# tests, docs, notebooks and examples were never shipped. Hatchling
# otherwise defaults to "everything not VCS-ignored", so state the
# sdist contents explicitly to keep the published archive identical
# in scope to what poetry-core produced.
[tool.hatch.build.targets.sdist]
include = ["/ib_async", "/README.md", "/LICENSE", "/pyproject.toml"]

[tool.ruff]
target-version = "py311"
exclude = [
  # The legacy Jupyter notebooks; examples/ is linted like the library.
  "notebooks/",
  "upstream_api_architecture/",
  # Generated protobuf bindings live under ib_async/_pb/ (gitignored,
  # produced by scripts/generate_protos.py). They aren't subject to
  # our lint or format rules.
  "ib_async/_pb/",
]

[tool.ruff.lint]
# Listed explicitly so a ruff upgrade never changes what is checked.
select = [
  # pycodestyle errors and pyflakes (ruff's long-standing defaults)
  "E4",
  "E7",
  "E9",
  "F",
  # convert legacy python syntax to modern syntax
  "UP",
  # isort imports
  "I",
  # simplifications
  "SIM",
  # pathlib over os.path / open()
  "PTH",
  # modern idioms (refurb)
  "FURB",
  # specific ignore / type-ignore codes
  "PGH",
  # imports at module level only; a deliberate lazy import (an optional
  # dependency) carries `noqa: PLC0415` with its reason
  "PLC0415",
  # no mutable or call-built argument defaults (shared across calls)
  "B006",
  "B008",
  # exceptions: chain re-raises, no blind catches or blind test asserts
  "B904",
  "BLE001",
  "B017",
  "TRY401",
  # zip() states whether unequal lengths are expected
  "B905",
  # equality, hashing and shared class state stay consistent
  "PLW1641",
  "RUF012",
  "PLR0124",
  # no blocking calls inside async functions
  "ASYNC210",
  "ASYNC220",
  "ASYNC221",
  "ASYNC222",
  "ASYNC230",
  "ASYNC251",
  # current idioms: comprehensions and literals, membership tests,
  # no redundant casts, placeholders or numeric unions
  "C4",
  "PIE790",
  "PIE807",
  "PIE810",
  "PLR0402",
  "PLR1714",
  "PLR5501",
  "PLR0133",
  "PYI041",
  "RUF021",
  "RUF046",
  "RUF059",
  # no exec(); no unused noqa comments
  "S102",
  "RUF100",
  # no assert for runtime checks in the library (python -O strips them)
  "S101",
]
per-file-ignores = { "tests/**" = ["S101"], "scripts/**" = ["S101"], "examples/notebooks/**" = ["I002"] }
ignore = [
  "E402", # Module level import not at top of file
  "SIM102", # collapsible-if: nested ifs often read clearer
  "SIM110", # reimplemented-builtin: explicit loops often read clearer
]

[tool.ruff.lint.isort]
# Every module defers annotations, so none is ever quoted (UP037 then
# unquotes any that are): I002 requires the import in each file.
required-imports = ["from __future__ import annotations"]

[tool.releasekit]
smoke = "ib_async.IB()"
# protos first: lint and the tests need the generated bindings.
checks = ["make protos", "make lint", "make test"]
# The bindings are gitignored; generate them in the export that is built.
prepare = ["make protos"]
changelog = { path = "docs/changelog.rst", contains = "Version {version}", forbid = "Version {version} (Unreleased)" }

[tool.releasekit.matrix]
python = ["3.11", "3.12", "3.13", "3.14", "3.15", "pypy3.11", "pypy3.12"]
command = "make test"
timeout = 600
